name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (for example v0.2.0), created on the commit this run builds. Leave empty for a test build.'
        required: false
        default: ''

permissions:
  contents: read

env:
  # libobs version the plugin is compiled against. Plugins built against an older
  # libobs load in newer OBS releases, so this stays at the oldest supported version.
  OBS_VERSION: 30.2.3

jobs:
  linux:
    name: Linux (core, tests, plugin compile check)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config libobs-dev libpango1.0-dev libfontconfig-dev fonts-noto-cjk ffmpeg

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DTONEARM_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Probe genuine animated HLS frames (diagnostic only)
        continue-on-error: true
        run: bash tests/online-motion-video-smoke.sh

  windows:
    name: Windows x64 (plugin package)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          path: tonearm

      - name: Cache libobs SDK
        id: obs-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/obs-sdk
          key: obs-sdk-${{ env.OBS_VERSION }}-windows-x64-v1

      - name: Fetch OBS Studio source
        if: steps.obs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --depth 1 --branch $env:OBS_VERSION https://github.com/obsproject/obs-studio.git obs-studio
          # OBS configures a 32-bit slice as a child process on Windows, and that
          # slice reads libdshowcapture even when plugins are turned off.
          git -C obs-studio submodule update --init --recursive --depth 1 plugins/win-dshow/libdshowcapture

      - name: Build libobs
        if: steps.obs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        working-directory: obs-studio
        run: |
          # The windows-x64 preset downloads OBS's prebuilt dependencies itself.
          # An empty virtual camera GUID keeps the 32-bit slice from configuring
          # the virtual camera module, which plugins don't need.
          cmake --preset windows-x64 -DENABLE_UI=OFF -DENABLE_PLUGINS=OFF -DENABLE_SCRIPTING=OFF `
            -DENABLE_BROWSER=OFF -DVIRTUALCAM_GUID= -DOBS_VERSION_OVERRIDE="$env:OBS_VERSION"
          # obs-frontend-api depends on libobs and w32-pthreads, so this builds every
          # target the Development install component expects to find.
          cmake --build build_x64 --target obs-frontend-api --config RelWithDebInfo -- /m
          cmake --install build_x64 --component Development --config RelWithDebInfo --prefix "${{ runner.temp }}/obs-sdk"

      - name: Configure
        shell: pwsh
        working-directory: tonearm
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCMAKE_PREFIX_PATH="${{ runner.temp }}/obs-sdk"
          -Dlibobs_DIR="${{ runner.temp }}/obs-sdk/cmake/libobs"
          -Dw32-pthreads_DIR="${{ runner.temp }}/obs-sdk/cmake/w32-pthreads"
          -DTONEARM_BUILD_TESTS=ON

      - name: Build
        shell: pwsh
        working-directory: tonearm
        run: cmake --build build --config RelWithDebInfo

      - name: Test
        shell: pwsh
        working-directory: tonearm
        run: ctest --test-dir build -C RelWithDebInfo --output-on-failure

      - name: Check experimental online artwork API (non-blocking)
        continue-on-error: true
        shell: pwsh
        working-directory: tonearm
        run: ./tests/online-motion-api-smoke.ps1

      - name: Probe Little Mermaid soundtrack and original motion FPS (diagnostic)
        continue-on-error: true
        shell: pwsh
        working-directory: tonearm
        run: ./tests/online-mermaid-motion-fps.ps1

      - name: Package
        shell: pwsh
        working-directory: tonearm
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(tonearm VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $label = $env:GITHUB_REF_NAME }
          elseif ($env:RELEASE_TAG) { $label = $env:RELEASE_TAG }
          else { $label = "$version-$($env:GITHUB_SHA.Substring(0,7))" }
          cmake --install build --config RelWithDebInfo --prefix stage
          # Debug symbols ship as a separate download.
          New-Item -ItemType Directory -Force symbols | Out-Null
          Move-Item stage/obs-plugins/64bit/*.pdb symbols/ -ErrorAction SilentlyContinue
          # Licence and notes travel inside the plugin's own data folder, so
          # extracting the zip over an OBS install adds nothing to the OBS root.
          Copy-Item README.md, LICENSE, NOTICE.md, CHANGELOG.md stage/data/obs-plugins/tonearm/
          foreach ($required in 'obs-plugins/64bit/tonearm.dll', 'data/obs-plugins/tonearm/locale/en-US.ini') {
            if (-not (Test-Path "stage/$required")) { throw "Package is missing $required" }
          }
          Compress-Archive -Path stage/* -DestinationPath "tonearm-$label-windows-x64.zip"
          # Print the archive layout so every package can be checked from the log.
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead("$PWD/tonearm-$label-windows-x64.zip")
          $zip.Entries | ForEach-Object { "{0,10}  {1}" -f $_.Length, $_.FullName }
          $zip.Dispose()
          Compress-Archive -Path symbols/* -DestinationPath "tonearm-$label-windows-x64-pdb.zip"
          "LABEL=$label" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: tonearm-${{ env.LABEL }}-windows-x64
          path: |
            tonearm/tonearm-*-windows-x64.zip
            tonearm/tonearm-*-windows-x64-pdb.zip

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Choose tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          tag="${RELEASE_TAG:-$GITHUB_REF_NAME}"
          project=$(sed -n 's/.*project(tonearm VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          if [ "$tag" != "v$project" ]; then
            echo "Tag $tag does not match the project version $project in CMakeLists.txt" >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Extract release notes
        run: |
          version="${TAG#v}"
          if [ -s "docs/release-notes/$TAG.md" ]; then
            cp "docs/release-notes/$TAG.md" notes.md
            exit 0
          fi
          awk -v v="$version" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # With a pushed tag this attaches to it; from a manual run the tag is
          # created on the commit that was built and tested.
          gh release create "$TAG" dist/*.zip --target "$GITHUB_SHA" \
            --latest --title "Tonearm ${TAG#v}" --notes-file notes.md
